{% extends "layout.html" %}

{% block title %}Lista de Proformas{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-lista-proformas {
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-lista-proformas th,
    .table-lista-proformas td {
        padding: 0.25rem 0.45rem;
        vertical-align: middle;
    }

    .table-lista-proformas thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-lista-proformas .acciones-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
    }

    .table-lista-proformas .accion-icon {
        border: none;
        background: none;
        padding: 0;
        margin: 0;
        line-height: 1;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .table-lista-proformas .accion-editar { color: #2563eb; }
    .table-lista-proformas .accion-pdf { color: #dc3545; }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
        <h5 class="mb-0 fw-bold text-secondary"><i class="bi bi-card-list"></i> Lista de Proformas</h5>
    </div>
    <div class="card-body">
        <form id="frmListaProformas" class="row g-2 g-lg-2 align-items-end">
            <div class="col-12 col-md-4 col-lg-3">
                <label for="txtCodigo" class="form-label small fw-bold text-muted">Código</label>
                <input type="text" id="txtCodigo" class="form-control form-control-sm" placeholder="Buscar por código..." maxlength="20" autocomplete="off">
            </div>
            <div class="col-12 col-md-4 col-lg-3">
                <label for="txtArticulo" class="form-label small fw-bold text-muted">Item</label>
                <input type="text" id="txtArticulo" class="form-control form-control-sm" placeholder="Buscar por item..." maxlength="50" autocomplete="off">
            </div>
            <div class="col-12 col-md-4 col-lg-4">
                <label for="selCliente" class="form-label small fw-bold text-muted">Cliente</label>
                <select id="selCliente" class="form-select form-select-sm">
                    <option value="0" selected>Todos</option>
                    {% for cli in clientes %}
                    <option value="{{ cli.idempresa }}">{{ cli.razonsocial }} (RUC: {{ cli.ruc }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-3">
                <button type="submit" class="btn btn-primary btn-sm px-4"><i class="bi bi-search"></i> Consultar</button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnExportExcelProformas" disabled><i class="bi bi-file-earmark-excel"></i> Exportar a Excel</button>
                <span class="ms-auto text-muted small fw-bold">No. de Registros: <span id="lblRowCountProformas">0</span></span>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 d-none" id="cardResultadoProformas">
    <div class="card-body">
        <h4 class="text-center fw-bold mb-3">LISTADO DE PROFORMAS</h4>
        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-lista-proformas align-middle">
                <thead id="thead-proformas"></thead>
                <tbody id="tbody-proformas"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const URL_REPORTE = {{ url_for('lista_proformas_post') | tojson }};
    const URL_EDITAR_BASE = {{ url_for('proformas_editar_page', id_proforma=0) | tojson }}.replace(/0$/, '');
    const URL_PDF_BASE = {{ url_for('proformas_pdf', id_proforma=0) | tojson }}.replace(/0$/, '');
    let lastExportProformas = null;

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    function fmtCelda(valor, idx) {
        if (valor === null || valor === undefined) return '';
        if (typeof valor === 'number' && Number.isFinite(valor)) {
            if (idx === 5) return String(Math.round(valor));
            if (idx === 4 || idx === 6) {
                return valor.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }
        return String(valor);
    }

    function urlEditar(idProforma) {
        return URL_EDITAR_BASE + String(idProforma);
    }

    function urlPdf(idProforma) {
        return URL_PDF_BASE + String(idProforma);
    }

    function nombreDesdeContentDisposition(header) {
        if (!header) return null;
        const mStar = header.match(/filename\*=UTF-8''([^;]+)/i);
        if (mStar) {
            try {
                return decodeURIComponent(mStar[1].trim());
            } catch (e) {
                return mStar[1].trim();
            }
        }
        const m = header.match(/filename="?([^";]+)"?/i);
        return m ? m[1].trim() : null;
    }

    async function descargarPdfProforma(idProforma) {
        try {
            const res = await fetch(urlPdf(idProforma), { credentials: 'same-origin' });
            if (!res.ok) {
                alert('No se pudo generar el PDF de la proforma.');
                return;
            }
            const blob = await res.blob();
            const nombre = nombreDesdeContentDisposition(res.headers.get('Content-Disposition'))
                || ('proforma_' + String(idProforma) + '.pdf');
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = nombre;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(blobUrl);
        } catch (e) {
            console.error(e);
            alert('Error al descargar el PDF.');
        }
    }

    function renderizarTabla(payload) {
        const thead = document.getElementById('thead-proformas');
        const tbody = document.getElementById('tbody-proformas');
        const headers = payload.headers || [];
        const rows = payload.data || [];
        const ids = payload.ids || [];

        thead.innerHTML = '<tr>' + headers.map(function (h) {
            return '<th>' + escapeHtml(h) + '</th>';
        }).join('') + '<th class="text-center">Acciones</th></tr>';

        let html = '';
        rows.forEach(function (row, index) {
            const idProforma = ids[index];
            html += '<tr>';
            (row || []).forEach(function (val, idx) {
                const align = (idx === 4 || idx === 5 || idx === 6) ? 'text-end' : '';
                html += '<td class="' + align + '">' + escapeHtml(fmtCelda(val, idx)) + '</td>';
            });
            if (idProforma != null && idProforma !== '') {
                html += '<td class="text-center">';
                html += '<span class="acciones-wrap">';
                html += '<a href="' + escapeHtml(urlEditar(idProforma)) + '" class="accion-icon accion-editar" title="Editar">';
                html += '<i class="bi bi-pencil" aria-hidden="true"></i></a>';
                html += '<button type="button" class="accion-icon accion-pdf btn-descargar-pdf" data-idproforma="' + escapeHtml(String(idProforma)) + '" title="Descargar PDF">';
                html += '<i class="bi bi-file-earmark-pdf" aria-hidden="true"></i></button>';
                html += '</span></td>';
            } else {
                html += '<td class="text-center text-muted">—</td>';
            }
            html += '</tr>';
        });
        tbody.innerHTML = html;
        tbody.querySelectorAll('.btn-descargar-pdf').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const id = parseInt(btn.getAttribute('data-idproforma'), 10);
                if (!Number.isFinite(id)) return;
                descargarPdfProforma(id);
            });
        });
        document.getElementById('lblRowCountProformas').textContent = String(rows.length);
    }

    async function exportProformasExcel(payload, meta) {
        if (typeof ExcelJS === 'undefined') {
            alert('No se pudo cargar la librería de Excel (ExcelJS). Recargue la página e intente de nuevo.');
            return;
        }
        const headers = payload.headers || [];
        const filas = payload.data || [];
        const ncols = headers.length;
        if (!ncols) return;

        const borderThin = { style: 'thin', color: { argb: 'FFCCCCCC' } };
        const allBorders = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Proformas', { views: [{ showGridLines: true }] });

        let rowIdx = 1;
        ws.mergeCells(rowIdx, 1, rowIdx, ncols);
        const titleCell = ws.getCell(rowIdx, 1);
        titleCell.value = 'LISTADO DE PROFORMAS';
        titleCell.font = { bold: true, size: 14 };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        titleCell.border = allBorders;
        ws.getRow(rowIdx).height = 26;
        rowIdx++;

        const metaRow = ws.addRow(['Código', meta.codigo || '(todos)', 'Item', meta.articulo || '(todos)', 'Cliente', meta.cliente || 'Todos']);
        metaRow.eachCell({ includeEmpty: true }, (cell) => {
            cell.border = allBorders;
        });
        rowIdx += 2;

        const hRow = ws.addRow(headers);
        hRow.font = { bold: true };
        hRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            const idx = colNumber - 1;
            cell.border = allBorders;
            if (idx === 4 || idx === 5 || idx === 6) {
                cell.alignment = { horizontal: 'right', vertical: 'middle' };
            }
        });

        filas.forEach((rowVals) => {
            const r = ws.addRow(rowVals || []);
            r.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                const idx = colNumber - 1;
                const v = rowVals && rowVals[idx];
                cell.border = allBorders;
                if (idx === 5 && typeof v === 'number' && Number.isFinite(v)) {
                    cell.numFmt = '0';
                    cell.alignment = { horizontal: 'right', vertical: 'middle' };
                }
                if ((idx === 4 || idx === 6) && typeof v === 'number' && Number.isFinite(v)) {
                    cell.numFmt = '#,##0.00';
                    cell.alignment = { horizontal: 'right', vertical: 'middle' };
                }
            });
        });

        ws.getColumn(1).width = 30;
        ws.getColumn(2).width = 16;
        ws.getColumn(3).width = 16;
        ws.getColumn(4).width = 40;
        ws.getColumn(5).width = 16;
        ws.getColumn(6).width = 12;
        ws.getColumn(7).width = 16;

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const stamp = new Date().toISOString().slice(0, 10);
        a.download = `listado_proformas_${stamp}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    async function ejecutarConsultaProformas() {
        lastExportProformas = null;
        document.getElementById('btnExportExcelProformas').disabled = true;
        const codigo = document.getElementById('txtCodigo').value.trim();
        const articulo = document.getElementById('txtArticulo').value.trim();
        const cliente = document.getElementById('selCliente').value || '0';
        const clienteLabel = document.getElementById('selCliente').selectedOptions[0]?.text || 'Todos';
        try {
            const res = await fetch(URL_REPORTE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo, articulo, cliente })
            });
            const payload = await res.json();
            if (!res.ok || payload.error) {
                document.getElementById('cardResultadoProformas').classList.add('d-none');
                document.getElementById('lblRowCountProformas').textContent = '0';
                document.getElementById('btnExportExcelProformas').disabled = true;
                alert(payload.error || 'Error al consultar el listado.');
                return;
            }
            document.getElementById('cardResultadoProformas').classList.remove('d-none');
            renderizarTabla(payload);
            lastExportProformas = {
                headers: payload.headers || [],
                data: payload.data || [],
                meta: { codigo, articulo, cliente: cliente === '0' ? 'Todos' : clienteLabel }
            };
            document.getElementById('btnExportExcelProformas').disabled = !payload.data || payload.data.length === 0;
        } catch (e) {
            console.error(e);
            document.getElementById('cardResultadoProformas').classList.add('d-none');
            document.getElementById('lblRowCountProformas').textContent = '0';
            document.getElementById('btnExportExcelProformas').disabled = true;
            alert('Error de red o del servidor.');
        }
    }

    document.getElementById('frmListaProformas').addEventListener('submit', async function (e) {
        e.preventDefault();
        await ejecutarConsultaProformas();
    });

    document.getElementById('btnExportExcelProformas').addEventListener('click', async function () {
        if (!lastExportProformas || !lastExportProformas.headers || !lastExportProformas.headers.length) {
            alert('Ejecute primero una búsqueda con resultados.');
            return;
        }
        try {
            await exportProformasExcel(
                { headers: lastExportProformas.headers, data: lastExportProformas.data },
                lastExportProformas.meta
            );
        } catch (err) {
            console.error(err);
            alert('No se pudo generar el archivo Excel.');
        }
    });

    await ejecutarConsultaProformas();
});
</script>
{% endblock %}
