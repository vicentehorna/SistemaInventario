# Blueprint Render — Sistema de Inventario
# https://render.com/docs/blueprint-spec
#
# Tras crear el servicio, configura en el panel (Environment) las variables secretas:
#   SQL_SERVER, SQL_DATABASE, SQL_USER, SQL_PASSWORD, FLASK_SECRET_KEY
#
# Opcional: usuario temporal desactivado en producción (solo en código local).

services:
  - type: web
    name: sistema-inventario
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: SQL_ODBC_DRIVER
        value: "ODBC Driver 18 for SQL Server"
